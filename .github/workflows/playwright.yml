name: Playwright Tests
run-name: ${{ github.event_name == 'schedule' && 'Nightly regression' || '' }}
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    # Nightly full regression, 03:00 UTC
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      suite:
        description: Test suite to run
        type: choice
        options: [all, api, auth, cart, checkout, products]
        default: all
      tag:
        description: Test set to run
        type: choice
        options: [regression, smoke]
        default: regression
# Pull requests run the @smoke set; pushes, the nightly schedule and manual runs (by default) run @regression
env:
  TEST_TAG: ${{ github.event_name == 'pull_request' && '@smoke' || github.event_name == 'workflow_dispatch' && format('@{0}', inputs.tag) || '@regression' }}
jobs:
  install:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    # Browsers and system dependencies are preinstalled in the official image.
    # Keep the tag in sync with the @playwright/test version in package-lock.json.
    container:
      image: mcr.microsoft.com/playwright:v1.59.1-noble
      options: --user 1001
    steps:
      - uses: actions/checkout@v4
      - name: Cache node_modules
        id: node-modules-cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install dependencies
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: npm ci

  quality:
    needs: install
    timeout-minutes: 10
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.59.1-noble
      options: --user 1001
    steps:
      - uses: actions/checkout@v4
      - name: Restore node_modules
        uses: actions/cache/restore@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          fail-on-cache-miss: true
      - name: Check formatting
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Type-check
        run: npm run typecheck

  test:
    name: test (${{ matrix.suite }}, ${{ github.event_name == 'pull_request' && 'smoke' || github.event_name == 'workflow_dispatch' && inputs.tag || 'regression' }})
    # Don't spend browser minutes on code that doesn't lint or compile
    needs: quality
    timeout-minutes: 60
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.59.1-noble
      options: --user 1001
    strategy:
      fail-fast: false
      # automationexercise.com answers "queue full" (503) under load: at most 2 suites x 2 workers hit it at once
      max-parallel: 2
      matrix:
        # Push/PR/nightly and manual "all" run every suite; a manual run can pick a single one
        suite: ${{ fromJSON((github.event_name != 'workflow_dispatch' || inputs.suite == 'all') && '["api","auth","cart","checkout","products"]' || format('["{0}"]', inputs.suite)) }}
    steps:
      - uses: actions/checkout@v4
      - name: Restore node_modules
        uses: actions/cache/restore@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          fail-on-cache-miss: true
      - name: Run Playwright tests
        # --pass-with-no-tests: with @smoke, some suites may have no matching tests
        run: npx playwright test tests/${{ matrix.suite }} --grep "$TEST_TAG" --workers=2 --pass-with-no-tests
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-${{ matrix.suite }}
          path: playwright-report/
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: allure-results-${{ matrix.suite }}
          path: allure-results/
          retention-days: 7

  allure-report:
    needs: test
    # Publish only from the default branch (not PRs), also when tests failed - that's when the report matters most
    if: ${{ !cancelled() && needs.test.result != 'skipped' && github.event_name != 'pull_request' && (github.ref_name == 'main' || github.ref_name == 'master') }}
    timeout-minutes: 15
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.59.1-noble
      options: --user 1001
    steps:
      - uses: actions/checkout@v4
      - name: Restore node_modules
        uses: actions/cache/restore@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          fail-on-cache-miss: true
      - name: Download Allure results from all suites
        uses: actions/download-artifact@v4
        with:
          pattern: allure-results-*
          merge-multiple: true
          path: allure-results
      # Each run saves a new cache entry; restore-keys picks the latest one, so trends carry over between runs
      - name: Restore Allure history
        uses: actions/cache@v4
        with:
          path: allure-history
          key: allure-history-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: allure-history-
      - name: Generate Allure report
        run: npm run allure:generate
      - uses: actions/upload-pages-artifact@v3
        with:
          path: allure-report

  deploy-report:
    needs: allure-report
    # Without this, a failed test job (upstream of allure-report) skips the deploy
    if: ${{ !cancelled() && needs.allure-report.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
