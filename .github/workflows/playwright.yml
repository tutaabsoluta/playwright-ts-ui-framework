name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      suite:
        description: Test suite to run
        type: choice
        options: [ all, auth, cart, checkout, products ]
        default: all
jobs:
  install:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    # Browsers and system dependencies are preinstalled in the official image.
    # Keep the tag in sync with the @playwright/test version in package-lock.json.
    container:
      image: mcr.microsoft.com/playwright:v1.59.1-noble
      options: --user 1001
    steps:
    - uses: actions/checkout@v4
    - name: Cache node_modules
      id: node-modules-cache
      uses: actions/cache@v4
      with:
        path: node_modules
        key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
    - name: Install dependencies
      if: steps.node-modules-cache.outputs.cache-hit != 'true'
      run: npm ci

  test:
    name: test (${{ matrix.suite }})
    needs: install
    timeout-minutes: 60
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.59.1-noble
      options: --user 1001
    strategy:
      fail-fast: false
      matrix:
        # Push/PR and manual "all" run every suite; a manual run can pick a single one
        suite: ${{ fromJSON((github.event_name != 'workflow_dispatch' || inputs.suite == 'all') && '["auth","cart","checkout","products"]' || format('["{0}"]', inputs.suite)) }}
    steps:
    - uses: actions/checkout@v4
    - name: Restore node_modules
      uses: actions/cache/restore@v4
      with:
        path: node_modules
        key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
        fail-on-cache-miss: true
    - name: Run Playwright tests
      run: npx playwright test tests/${{ matrix.suite }} --workers=2
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report-${{ matrix.suite }}
        path: playwright-report/
        retention-days: 30
